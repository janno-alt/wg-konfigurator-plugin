name: Release Plugin ZIP

# Ein Release entsteht, indem ein Versions-Tag vX.Y.Z gepusht wird.
# Tags mit Bindestrich (z. B. v1.2.0-beta.1) werden als Vorabversion markiert.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

env:
  PLUGIN_SLUG: wg-konfigurator
  MAIN_FILE: wg-konfigurator.php

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag-Version gegen Plugin-Kopf prüfen
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          HEADER_VERSION="$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' "$MAIN_FILE" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"
          CONST_VERSION="$(grep -m1 -E "define\([[:space:]]*'WG_KONFIGURATOR_VERSION'" "$MAIN_FILE" | sed -E "s/.*'WG_KONFIGURATOR_VERSION',[[:space:]]*'([^']+)'.*/\1/")"
          echo "Tag: $TAG_VERSION, Plugin-Kopf: $HEADER_VERSION, Konstante: $CONST_VERSION"
          if [ "$TAG_VERSION" != "$HEADER_VERSION" ]; then
            echo "::error::Tag-Version $TAG_VERSION passt nicht zur Version $HEADER_VERSION im Plugin-Kopf von $MAIN_FILE."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$CONST_VERSION" ]; then
            echo "::error::Tag-Version $TAG_VERSION passt nicht zur Konstante WG_KONFIGURATOR_VERSION ($CONST_VERSION)."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Composer install (no-dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Quiz – npm install
        working-directory: assets/quiz-app
        run: npm ci --no-audit --no-fund

      - name: Quiz – npm build
        working-directory: assets/quiz-app
        run: npm run build

      - name: Build plugin ZIP
        run: |
          STAGE="$RUNNER_TEMP/$PLUGIN_SLUG"
          mkdir -p "$STAGE"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.editorconfig' \
            --exclude='.DS_Store' \
            --exclude='node_modules' \
            --exclude='assets/quiz-app/src' \
            --exclude='assets/quiz-app/vite.config.js' \
            --exclude='assets/quiz-app/package*.json' \
            --exclude='assets/quiz-app/index.html' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='INSTALL.md' \
            --exclude='docs' \
            --exclude='*.zip' \
            ./ "$STAGE/"
          test -f "$STAGE/vendor/autoload.php" || { echo "::error::vendor/autoload.php fehlt im Paket."; exit 1; }
          ls "$STAGE"/assets/quiz-app/dist/assets/index.*.js >/dev/null || { echo "::error::Quiz-Build fehlt im Paket."; exit 1; }
          cd "$RUNNER_TEMP"
          zip -rq "$GITHUB_WORKSPACE/$PLUGIN_SLUG.zip" "$PLUGIN_SLUG"
          unzip -l "$GITHUB_WORKSPACE/$PLUGIN_SLUG.zip" | tail -1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PLUGIN_SLUG }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
